const clamp01=v=>v<0?0:v>1?1:v,lerp=(a,b,p)=>a+(b-a)*p;
function bez(x1,y1,x2,y2){const a=(p,q)=>1-3*q+3*p,b=(p,q)=>3*q-6*p,c=p=>3*p,f=(t,p,q)=>((a(p,q)*t+b(p,q))*t+c(p))*t,df=(t,p,q)=>3*a(p,q)*t*t+2*b(p,q)*t+c(p);

/* قمم الصوت (ضربات الجهير) في نافدة من الأغنية */
function detectPeaks(buf,start,dur){const sr=buf.sampleRate,d=buf.getChannelData(0),hop=Math.round(sr*.005),n=Math.floor(dur*200),env=new Float32Array(n);let lp=0;const a=Math.exp(-2*Math.PI*160/sr),b0=Math.floor(start*sr);

  p=pop(t,CTA_AT+.55);if(p.on){x.save();x.globalAlpha=p.a;x.font=font(700,54);x.fillStyle=C.gold2;x.direction='rtl';x.fillText('للحجز والاستفسار',W/2,925);x.font=font(900,92);x.fillStyle='#fff';x.direction='ltr';x.fillText(PHONE,W/2,1040);x.restore()}
  const ut=lt-.9,n=Math.max(0,Math.min(URL_.length,Math.floor(ut*20)));if(ut>0){const bw=760,bh=92,by=1140;x.save();rr(x,W/2-bw/2,by,bw,bh,bh/2);x.fillStyle='rgba(255,255,255,.12)';x.fill();x.lineWidth=2;x.strokeStyle='rgba(255,255,255,.28)';x.stroke();
    x.font=font(500,38);x.direction='ltr';x.textAlign='left';x.fillStyle='#fff';const full=x.measureText(URL_).width,sx=W/2-full/2;x.fillText(URL_.slice(0,n),sx,by+bh/2+2);
    if(n<URL_.length||(t*1.2)%1<.55){const cw=x.measureText(URL_.slice(0,n)).width;x.fillStyle=C.gold2;x.fillRect(sx+cw+4,by+bh/2-22,4,44)}x.restore()}
  const bt=lt-2.0,TAP=1.25;if(bt>0){const sp=spring(bt,.5,.55),pp=clamp01((bt-TAP)/.3),sc=(.7+.3*sp)*(1-.05*Math.sin(Math.PI*pp)),bw=540,bh=116,by=1330;
    x.save();x.translate(W/2,by+bh/2);x.scale(sc,sc);x.translate(-W/2,-(by+bh/2));x.globalAlpha=clamp01(bt*5);const g=x.createLinearGradient(W/2-bw/2,0,W/2+bw/2,0);g.addColorStop(0,C.gold2);g.addColorStop(1,C.gold);
    rr(x,W/2-bw/2,by,bw,bh,bh/2);x.fillStyle=g;x.fill();x.font=font(900,52);x.fillStyle=C.navy;x.textAlign='center';x.direction='rtl';x.fillText('احجز الآن',W/2,by+bh/2+3);x.restore();ripple(x,W/2+70,by+bh/2,(bt-TAP)/.6)}
  x.restore()}

function flash(x,t){for(const f of [0,LIST[0]-.05,CTA_AT]){const a=1-clamp01((t-f)/.14);if(t>=f&&a>0){x.fillStyle=`rgba(255,255,255,${(a*.6).toFixed(3)})`;x.fillRect(0,0,W,H)}}}
function drawFrame(x,t){x.save();x.filter='none';x.globalAlpha=1;bg(x,t);hook(x,t);list(x,t);cta(x,t);flash(x,t);x.restore()}

/* الصوت: الموسيقى بس، بتتظبط على peak ثابت وبتخفت في الآخر */
async function renderAudio(){const ac=new OfflineAudioContext(2,Math.ceil(TOTAL*SR),SR),b=MUSIC_BUF;let pk=0;
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=Math.floor(CFG.musicStart*SR);i<Math.min(d.length,Math.floor((CFG.musicStart+TOTAL)*SR));i++){const a=Math.abs(d[i]);if(a>pk)pk=a}}
  const lim=ac.createDynamicsCompressor();lim.threshold.value=-3;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.001;lim.release.value=.1;lim.connect(ac.destination);
  const src=ac.createBufferSource(),g=ac.createGain();src.buffer=b;g.gain.setValueAtTime(pk>0?Math.min(3,PEAK/pk):1,0);g.gain.setValueAtTime(g.gain.value,TOTAL-FADE_OUT);g.gain.linearRampToValueAtTime(0,TOTAL);
  src.connect(g).connect(lim);src.start(0,CFG.musicStart);return ac.startRendering()}
async function pickAudio(){for(const c of [{codec:'mp4a.40.2',mux:'aac'},{codec:'opus',mux:'opus'}]){const cfg={codec:c.codec,sampleRate:SR,numberOfChannels:2,bitrate:192000};try{if((await AudioEncoder.isConfigSupported(cfg)).supported)return{cfg,mux:c.mux}}catch(e){console.error(e)}}return null}
async function pickVideo(){const bitrate=Math.round(Math.min(16e6,W*H*FPS*.1));for(const codec of ['avc1.640033','avc1.4d0033','avc1.420033']){const cfg={codec,width:W,height:H,bitrate,framerate:FPS,bitrateMode:'variable',latencyMode:'quality',avc:{format:'avc'}};try{if((await VideoEncoder.isConfigSupported(cfg)).supported)return cfg}catch(e){console.error(e)}}return null}
window.JOB={state:'idle'};
async function exportMp4(){JOB.state='audio';log('جاري تجهيز الصوت…');const abuf=await renderAudio(),ap=await pickAudio(),vcfg=await pickVideo();if(!vcfg)throw new Error('H.264 غير مدعوم');
  const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:W,height:H,frameRate:FPS},audio:ap?{codec:ap.mux,numberOfChannels:2,sampleRate:SR}:undefined,fastStart:'in-memory'});let err=null;
  if(ap){const ae=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>{err=e}});ae.configure(ap.cfg);const N=abuf.length,CH=1024,L=abuf.getChannelData(0),R=abuf.getChannelData(1);
    for(let i=0;i<N;i+=CH){const n=Math.min(CH,N-i),d=new Float32Array(n*2);d.set(L.subarray(i,i+n),0);d.set(R.subarray(i,i+n),n);const ad=new AudioData({format:'f32-planar',sampleRate:SR,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(i/SR*1e6),data:d});ae.encode(ad);ad.close()}await ae.flush();ae.close()}
  const ve=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>{err=e}});ve.configure(vcfg);const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d',{alpha:false});x.imageSmoothingQuality='high';
  const NF=Math.round(TOTAL*FPS);JOB.state='video';for(let i=0;i<NF;i++){if(err)throw err;drawFrame(x,i/FPS);const fr=new VideoFrame(cv,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});ve.encode(fr,{keyFrame:i%(FPS*2)===0});fr.close();
    while(ve.encodeQueueSize>6)await new Promise(r=>setTimeout(r,3));if(i%15===0){JOB.progress=Math.round(i/NF*100);log('جاري عمل الفيديو… '+JOB.progress+'%');await new Promise(r=>setTimeout(r,0))}}
  await ve.flush();if(err)throw err;ve.close();muxer.finalize();const blob=new Blob([muxer.target.buffer],{type:'video/mp4'});JOB.info={key:KEY,sec:+TOTAL.toFixed(2),MB:+(blob.size/1e6).toFixed(1),audio:ap?ap.mux:'none'};JOB.state='done';log('✅ جاهز');return blob}
loadAll().then(()=>{window.READY=true;drawFrame($('cv').getContext('2d'),Math.min(11,TOTAL-.5));log('جاهز · '+KEY+' · '+TOTAL.toFixed(1)+' ثانية')}).catch(e=>{console.error(e);log('فشل التحميل: '+e.message)});
</script>
