<style>
*{box-sizing:border-box;margin:0;padding:0}

.lb .la,.lb .le,.ck .la,.ck .le,th .la,th .le{display:inline}.lb .le:before,th .le:before{content:" / ";margin-inline-start:1mm}.lb .le,th .le{opacity:.8}.ck .le{margin-inline-start:2mm;font-size:.78em}

.page[data-mode=du] .ov{display:none}.page:not([data-mode=du]) .du{display:none}
@media print{tr.empty{display:none!important}}
.pdfing tr.empty{display:none!important}

@page{size:A4;margin:0}
@media print{html,body{background:#fff;height:296mm;overflow:hidden}.page{margin:0;box-shadow:none;height:296.5mm}.noprint,.x,.add{display:none!important}[contenteditable]{outline:none!important}[data-ph]:empty:before{content:""}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

<script>
const DOC='invoice';
const D={
 title:['فاتورة','Invoice'],inv_no:['رقم الفاتورة','Invoice No.'],inv_date:['التاريخ','Date'],due:['تاريخ الاستحقاق','Due date'],
 billto:['العميل','Billed to'],trip:['الرحلة','Trip'],phone:['التليفون','Phone'],dest:['الوجهة والتواريخ','Destination & dates'],
 items:['البنود','Items'],desc:['البيان','Description'],qty:['العدد','Qty'],price:['سعر الوحدة','Unit price'],amt:['الإجمالي','Amount'],
 sub:['المجموع','Subtotal'],disc:['الخصم','Discount'],total:['الإجمالي الكلي','Total'],paid:['المدفوع','Paid'],bal:['المتبقي','Balance due'],
 pays:['الدفعات','Payments'],pdate:['التاريخ','Date'],pmeth:['الطريقة','Method'],pamt:['المبلغ','Amount'],
 notes:['ملاحظات','Notes'],thx:['شكراً لاختيارك نوك تورز','Thank you for choosing Nook Tours'],
};
function afterLang(){if(window.calc)calc()}

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const page=$('.page');let LANG='ar';
function applyLang(){$$('[data-k]').forEach(el=>{if(el.dataset.ed)return;const d=D[el.dataset.k];if(!d)return;
  el.innerHTML=LANG==='ar'?d[0]:LANG==='en'?d[1]:`<span class="la">${d[0]}</span><span class="le">${d[1]}</span>`});
  page.dir=LANG==='en'?'ltr':'rtl';$$('[data-th]').forEach(x=>{if(x.tagName==='BUTTON')x.classList.toggle('on',x.dataset.th===page.dataset.th)});renderChecks&&renderChecks();$$('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));afterLang&&afterLang()}
$$('[data-lang]').forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;applyLang()});
$$('[data-th]').forEach(b=>b.onclick=()=>{page.dataset.th=b.dataset.th;$$('[data-th]').forEach(x=>{if(x.tagName==='BUTTON')x.classList.toggle('on',x===b)})});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.k)t.dataset.ed=1});
/* إخفاء صف بزرار × */
document.addEventListener('click',e=>{const x=e.target.closest('.x');if(x&&!x.closest('tr')){const c=x.parentElement;c.style.display='none';c.dataset.hid=1}});
/* نقط الصح/الغلط */
const WORDS={ok:['شامل','Included'],no:['غير شامل','Not included']};
function renderChecks(){$$('.ck').forEach(c=>{const s=c.dataset.s,i=c.querySelector('i'),w=c.querySelector('b');i.textContent=s==='1'?'✓':s==='0'?'✕':'';
  if(w){const x=s==='1'?WORDS.ok:WORDS.no;w.textContent=LANG==='ar'?x[0]:LANG==='en'?x[1]:x[0]+' / '+x[1]}})}
document.addEventListener('click',e=>{const c=e.target.closest('.ck');if(!c||e.target.closest('[contenteditable]'))return;const o={'1':'0','0':'','':'1'};c.dataset.s=o[c.dataset.s]??'1';renderChecks()});
/* لوحة التحكم في النص */
(function(){let cur=null;const nm=$('#tpn');
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('[contenteditable]');if(!t)return;cur=t;if(t.dataset.o===undefined)t.dataset.o=t.getAttribute('style')||'';nm.textContent=(t.textContent||'').trim().slice(0,20)});
$('#tp').addEventListener('mousedown',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()});
const blk=el=>{let x=el;while(x&&getComputedStyle(x).display==='inline')x=x.parentElement;return x||el};
$('#tp').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(a==='showall'){$$('[data-hid]').forEach(x=>{x.style.display='';delete x.dataset.hid});$$('[data-vh]').forEach(x=>{x.style.visibility='';delete x.dataset.vh});return}
 if(!cur)return nm.textContent='اضغط على نص الأول';const cs=getComputedStyle(cur);
 if(a==='s+'||a==='s-')cur.style.fontSize=(parseFloat(cs.fontSize)+(a==='s+'?1:-1))+'px';
 else if(a==='b')cur.style.fontWeight=(+cs.fontWeight>=700?'500':'900');
 else if(a==='al'||a==='ac'||a==='ar2')blk(cur).style.textAlign=a==='al'?'left':a==='ac'?'center':'right';
 else if(a==='hide'){cur.style.visibility='hidden';cur.dataset.vh=1}
 else if(a==='reset'){cur.setAttribute('style',cur.dataset.o||'');delete cur.dataset.vh}});
$('#tpc').addEventListener('input',e=>{if(cur)cur.style.color=e.target.value})})();
async function dlPdf(){const b=$('#pdfBtn'),old=b.textContent;b.textContent='...';b.disabled=true;document.body.classList.add('pdfing');const keep=page.getAttribute('style')||'';page.style.margin='0';page.style.boxShadow='none';page.style.height='296.5mm';
 try{await document.fonts.ready;await html2pdf().set({margin:0,filename:'nook-tours-'+DOC+'.pdf',image:{type:'jpeg',quality:.98},html2canvas:{scale:3,useCORS:true,scrollX:0,scrollY:0,windowWidth:page.offsetWidth},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:[]}}).from(page).save()}
 catch(e){alert('تعذّر إنشاء الـ PDF: '+e.message+'\nاستخدم اطبع واختار Save as PDF.')}
 finally{document.body.classList.remove('pdfing');page.setAttribute('style',keep);b.textContent=old;b.disabled=false}}


const ROW=`<tr><td class="n"></td><td contenteditable data-ph="اكتب البند · Item"></td><td class="num" contenteditable data-ph="1"></td><td class="num" contenteditable data-ph="0"></td><td class="num t">0</td><td class="rx noprint" style="width:0;padding:0;position:static"><b class="x noprint" style="inset-inline-end:-6mm;top:2mm">×</b></td></tr>`,PROW=`<tr><td class="n"></td><td contenteditable data-ph="00 / 00 / 0000"></td><td contenteditable data-ph="كاش / تحويل"></td><td class="num pa" contenteditable data-ph="0"></td><td class="rx noprint" style="width:0;padding:0;position:static"><b class="x noprint" style="inset-inline-end:-6mm;top:2mm">×</b></td></tr>`;
const DT={
 inv:{t:['فاتورة','Invoice'],no:'INV-0000',due:['تاريخ الاستحقاق','Due date']},
 dep:{t:['إيصال استلام عربون','Deposit Receipt'],no:'DEP-0000',due:['سداد المتبقي قبل','Balance due by']},
 rec:{t:['إيصال استلام دفعة','Payment Receipt'],no:'RCT-0000',due:['سداد المتبقي قبل','Balance due by']},
 fin:{t:['إيصال سداد نهائي','Final Payment Receipt'],no:'RCT-0000',due:['تاريخ السداد','Paid on']}
};
let TYPE='inv',stMode=-1;
const SL={PAID:['مدفوع','PAID'],DEP:['استلام عربون','DEPOSIT RECEIVED'],PART:['دفع جزئي','PARTIAL'],UNPAID:['غير مدفوع','UNPAID']},SK=['PAID','DEP','PART','UNPAID',''];
function num(s){return parseFloat(String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,\s٫]/g,''))||0}
const fmt=n=>n.toLocaleString('en-US',{maximumFractionDigits:2}),txt=s=>($(s).textContent||'').trim();
const T=(l,a,e)=>l==='ar'?a:e;
function msgText(l){const tot=num($('#vTot').textContent),paid=num($('#vPaid').textContent),bal=tot-paid,cur=txt('#cur')||'EGP',due=txt('#fDue'),trip=txt('#fTrip');
 const A=n=>n>0?fmt(n)+' '+cur:'____ '+cur,dueS=due?T(l,' قبل '+due,' by '+due):'',tripS=trip?T(l,' لرحلة '+trip,' for '+trip):'';
 if(TYPE==='dep')return T(l,'استلمنا منكم مبلغ '+A(paid)+' كعربون لتأكيد الحجز'+tripS+'.'+(bal>0?' المتبقي '+A(bal)+' يُسدد'+dueS+'.':''),
   'We have received '+A(paid)+' as a deposit to confirm your booking'+tripS+'.'+(bal>0?' The remaining '+A(bal)+' is due'+dueS+'.':''));
 if(TYPE==='rec')return T(l,'استلمنا منكم دفعة. إجمالي المدفوع '+A(paid)+(bal>0?' والمتبقي '+A(bal)+(due?' يُسدد قبل '+due:''):'')+'.',
   'Payment received. Total paid so far '+A(paid)+(bal>0?', remaining '+A(bal)+(due?' due by '+due:''):'')+'.');
 if(TYPE==='fin')return T(l,'استلمنا كامل المبلغ '+A(tot)+'. لا توجد أي مبالغ مستحقة.','We have received the full amount of '+A(tot)+'. No balance is due.');
 return T(l,'تفاصيل الحجز'+tripS+' بإجمالي '+A(tot)+'.'+(bal>0?' المتبقي '+A(bal)+(due?' يُسدد قبل '+due:'')+'.':''),
   'Booking charges'+tripS+', total '+A(tot)+'.'+(bal>0?' Balance due '+A(bal)+(due?' by '+due:'')+'.':''))}
function calc(){let sub=0,paid=0;$$('#rows tr,#prows tr').forEach(tr=>tr.classList.toggle('empty',![...tr.querySelectorAll('td[contenteditable]')].some(td=>td.textContent.trim())));
 $$('#rows tr').forEach((tr,i)=>{tr.querySelector('.n').textContent=i+1;const c=tr.children,q=c[2].textContent.trim(),tt=(q===''?1:num(q))*num(c[3].textContent);
  tr.querySelector('.t').textContent=fmt(tt);sub+=tt});
 $$('#prows tr').forEach((tr,i)=>{tr.querySelector('.n').textContent=i+1;paid+=num(tr.querySelector('.pa').textContent)});
 const disc=num($('#vDisc').textContent),tot=sub-disc;$('#vSub').textContent=fmt(sub);$('#vTot').textContent=fmt(tot);$('#vPaid').textContent=fmt(paid);$('#vBal').textContent=fmt(tot-paid);
 const m=$('#msg');if(!m.dataset.ed&&document.activeElement!==m){m.innerHTML=LANG==='both'?'<span class="la">'+msgText('ar')+'</span><span class="le">'+msgText('en')+'</span>':msgText(LANG==='en'?'en':'ar')}
 let k=stMode;if(k<0)k=tot<=0?4:(tot-paid<=0?0:paid>0?(TYPE==='dep'?1:2):3);
 const s=$('#stamp'),key=SK[k];s.dataset.s=key?'1':'';s.textContent=key?(LANG==='both'?SL[key][0]+' / '+SL[key][1]:SL[key][LANG==='en'?1:0]):''}
function addRow(id,tpl){const tb=$('#'+id);tb.insertAdjacentHTML('beforeend',tpl);calc();const f=$('.ft').getBoundingClientRect().top;
 const last=$('.tot').getBoundingClientRect().bottom,bd=$('.body').lastElementChild.getBoundingClientRect().bottom;
 if(Math.max(last,bd)>f-8){tb.lastElementChild.remove();calc();alert('الصفحة اتملت: مفيش مكان لسطر زيادة في الصفحة دي')}}
document.addEventListener('input',e=>{if(e.target.id==='msg'){e.target.dataset.ed=1;return}calc()});
document.addEventListener('click',e=>{const x=e.target.closest('.x');if(x&&x.closest('tr')){x.closest('tr').remove();calc()}});
function cycleStamp(){const cur=stMode<0?-1:stMode;stMode=cur>=4?-1:cur+1;calc()}
function setType(t,noLang){TYPE=t;const d=DT[t];D.title=d.t;D.due=d.due;$('#fNo').dataset.ph=d.no;D.inv_no=[t==='inv'?'رقم الفاتورة':'رقم الإيصال',t==='inv'?'Invoice No.':'Receipt No.'];
 delete $('#msg').dataset.ed;stMode=-1;$$('[data-dt]').forEach(b=>b.classList.toggle('on',b.dataset.dt===t));if(!noLang)applyLang()}
$$('[data-dt]').forEach(b=>b.onclick=()=>setType(b.dataset.dt));
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return p(d.getDate())+' / '+p(d.getMonth()+1)+' / '+d.getFullYear()};
function addDeposit(){const p=num($('#pct').value),tot=num($('#vTot').textContent);if(!p||!tot){alert('اكتب النسبة الأول وتأكد إن فيه بنود بأسعار');return}
 const tb=$('#prows'),empty=[...tb.children].find(r=>!r.querySelector('.pa').textContent.trim());
 if(!empty){tb.insertAdjacentHTML('beforeend',PROW)}const r=empty||tb.lastElementChild;r.children[1].textContent=today();r.querySelector('.pa').textContent=fmt(Math.round(tot*p/100));
 if(TYPE==='inv')setType('dep');else{delete $('#msg').dataset.ed;calc()}}
function genWA(){const l=LANG==='en'?'en':'ar',nm=txt('#fName'),no=txt('#fNo');
 const ar='أهلاً '+(nm||'يا فندم')+'،\n'+msgText('ar')+(no?'\nرقم المستند: '+no:'')+'\nأي استفسار تواصل معنا: 01005377933\nنوك تورز',
  en='Hello '+(nm||'')+',\n'+msgText('en')+(no?'\nDocument No.: '+no:'')+'\nAny questions? 01005377933\nNook Tours';
 $('#wa').value=LANG==='both'?ar+'\n\n'+en:l==='en'?en:ar}
function copyWA(){const t=$('#wa');if(!t.value)genWA();t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}const b=$('#cpb');b.textContent='اتنسخت';setTimeout(()=>b.textContent='انسخ',1500)}
(location.hash||'').slice(1).split(',').forEach(x=>{if(DT[x])setType(x,true)});
calc();

(location.hash||'').slice(1).split(',').forEach(x=>{if(['ar','en','both'].includes(x))LANG=x;if(['gen','dahab','sokhna','bw'].includes(x))page.dataset.th=x});
applyLang();
</script>
