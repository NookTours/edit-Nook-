<script>
const DOC='confirmation';
const D={
 title:['تأكيد الحجز','Booking Confirmation'],
 conf_no:['رقم التأكيد','Confirmation No.'],issued:['تاريخ الإصدار','Date issued'],
 thanks:['شكراً لاختيارك نوك تورز','Thanks for choosing Nook Tours'],
 glad:['يسعدنا تأكيد حجزك. تفاصيل رحلتك تحت.','We are glad to confirm your reservation. Your trip details are below.'],
 guest:['اسم الضيف','Guest name'],dest:['الوجهة','Destination'],
 sec1:['تفاصيل الحجز','Reservation details'],sec2:['الخدمات','Services'],sec3:['ملاحظات مهمة','Important notes'],
 hotel:['الفندق','Hotel'],room:['نوع الغرفة','Room type'],cin:['تسجيل الدخول (Check-in)','Check-in'],cout:['تسجيل الخروج (Check-out)','Check-out'],
 nights:['عدد الليالي','Nights'],adults:['عدد البالغين','Adults'],kids:['عدد الأطفال','Children'],rooms:['عدد الغرف','Rooms'],
 tr_time:['موعد الانتقالات','Transfer time'],dep:['موعد التحرك','Departure time'],meet:['مكان التجمع','Meeting point'],bookno:['رقم الحجز','Booking No.'],
 c_trans:['الانتقالات','Transfers'],c_bf:['الفطار','Breakfast'],c_dn:['العشاء','Dinner'],c_ln:['الغداء','Lunch'],
 thx:['نتمنى لك رحلة سعيدة','Wishing you a wonderful trip'],
 leader:['صاحب المجموعة','Group leader'],vdate:['تاريخ الزيارة','Visit date'],dentry:['وقت الدخول','Entry time'],dexit:['وقت الخروج','Exit time'],
};
function afterLang(){}

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const page=$('.page');let LANG='ar';
function applyLang(){$$('[data-k]').forEach(el=>{if(el.dataset.ed)return;const d=D[el.dataset.k];if(!d)return;
  el.innerHTML=LANG==='ar'?d[0]:LANG==='en'?d[1]:`<span class="la">${d[0]}</span><span class="le">${d[1]}</span>`});
  page.dir=LANG==='en'?'ltr':'rtl';$$('[data-th]').forEach(x=>{if(x.tagName==='BUTTON')x.classList.toggle('on',x.dataset.th===page.dataset.th)});renderChecks&&renderChecks();$$('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));afterLang&&afterLang()}
$$('[data-lang]').forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;applyLang()});
$$('[data-th]').forEach(b=>b.onclick=()=>{page.dataset.th=b.dataset.th;$$('[data-th]').forEach(x=>{if(x.tagName==='BUTTON')x.classList.toggle('on',x===b)})});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.k)t.dataset.ed=1});
/* إخفاء صف بزرار × */
document.addEventListener('click',e=>{const x=e.target.closest('.x');if(x&&!x.closest('tr')){const c=x.parentElement;c.style.display='none';c.dataset.hid=1}});
/* نقط الصح/الغلط */
const WORDS={ok:['شامل','Included'],no:['غير شامل','Not included']};
function renderChecks(){$$('.ck').forEach(c=>{const s=c.dataset.s,i=c.querySelector('i'),w=c.querySelector('b');i.textContent=s==='1'?'✓':s==='0'?'✕':'';
  if(w){const x=s==='1'?WORDS.ok:WORDS.no;w.textContent=LANG==='ar'?x[0]:LANG==='en'?x[1]:x[0]+' / '+x[1]}})}
document.addEventListener('click',e=>{const c=e.target.closest('.ck');if(!c||e.target.closest('[contenteditable]'))return;const o={'1':'0','0':'','':'1'};c.dataset.s=o[c.dataset.s]??'1';renderChecks()});
/* لوحة التحكم في النص */
(function(){let cur=null;const nm=$('#tpn');
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('[contenteditable]');if(!t)return;cur=t;if(t.dataset.o===undefined)t.dataset.o=t.getAttribute('style')||'';nm.textContent=(t.textContent||'').trim().slice(0,20)});
$('#tp').addEventListener('mousedown',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()});
const blk=el=>{let x=el;while(x&&getComputedStyle(x).display==='inline')x=x.parentElement;return x||el};
$('#tp').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(a==='showall'){$$('[data-hid]').forEach(x=>{x.style.display='';delete x.dataset.hid});$$('[data-vh]').forEach(x=>{x.style.visibility='';delete x.dataset.vh});return}
 if(!cur)return nm.textContent='اضغط على نص الأول';const cs=getComputedStyle(cur);
 if(a==='s+'||a==='s-')cur.style.fontSize=(parseFloat(cs.fontSize)+(a==='s+'?1:-1))+'px';
 else if(a==='b')cur.style.fontWeight=(+cs.fontWeight>=700?'500':'900');
 else if(a==='al'||a==='ac'||a==='ar2')blk(cur).style.textAlign=a==='al'?'left':a==='ac'?'center':'right';
 else if(a==='hide'){cur.style.visibility='hidden';cur.dataset.vh=1}

$('#tpc').addEventListener('input',e=>{if(cur)cur.style.color=e.target.value})})();
